name: Gameplay feature
description: Scoped gameplay or technical implementation item
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome matters to the player or developer?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete and testable behaviors
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope and trade-offs
  - type: textarea
    id: validation
    attributes:
      label: Test plan and linked stage issue
