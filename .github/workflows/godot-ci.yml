name: Godot game validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project and check parse errors
        run: godot --headless --path game --editor --quit
      - name: Test spell semantics
        run: godot --headless --path game --script res://tests/test_spells.gd
      - name: Test run progression
        run: godot --headless --path game --script res://tests/test_run.gd
      - name: Test keyboard and mouse controls
        run: godot --headless --path game --script res://tests/test_controls.gd
      - name: Stress bounded spell resolution
        run: godot --headless --path game --script res://tests/test_stress.gd
      # The image installs templates under /root, but container jobs run with HOME=/github/home.
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Export Windows debug build
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Windows Desktop" ../build/Spellforge.exe
          test -s build/Spellforge.exe
      - name: Upload Windows demo candidate
        uses: actions/upload-artifact@v4
        with:
          name: spellforge-windows-debug
          path: build/Spellforge.exe
          if-no-files-found: error

  windows-artifact-smoke:
    needs: validate-and-export
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the exported game
        uses: actions/download-artifact@v4
        with:
          name: spellforge-windows-debug
          path: build
      - name: Exercise the packaged game on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $game = Join-Path $env:GITHUB_WORKSPACE 'build/Spellforge.exe'
          foreach ($suite in @('spells', 'run', 'controls')) {
            $script = Join-Path $env:GITHUB_WORKSPACE "game/tests/test_$suite.gd"
            $log = Join-Path $env:RUNNER_TEMP "spellforge-$suite.log"
            $process = Start-Process -FilePath $game -ArgumentList @(
              '--headless', '--script', $script, '--log-file', $log
            ) -NoNewWindow -PassThru -Wait
            if ($process.ExitCode -ne 0) {
              throw "$suite exited with code $($process.ExitCode)"
            }
            $output = Get-Content $log -Raw
            Write-Output $output
            if ($output -match 'SCRIPT ERROR:|ERROR:|ObjectDB instances leaked') {
              throw "$suite reported a runtime error"
            }
            if ($output -notmatch '\d+ checks, 0 failures') {
              throw "$suite did not report successful assertions"
            }
          }
      - name: Upload Windows runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spellforge-windows-runtime-logs
          path: ${{ runner.temp }}/spellforge-*.log
          if-no-files-found: warn
