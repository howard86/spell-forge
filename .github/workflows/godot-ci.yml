name: Godot foundation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project and check parse errors
        run: godot --headless --path game --editor --quit
      - name: Export Windows debug build
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Windows Desktop" ../build/Spellforge.exe
          test -s build/Spellforge.exe
      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: spellforge-windows-debug
          path: build/Spellforge.exe
          if-no-files-found: error
