name: Godot game validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project and check parse errors
        run: godot --headless --path game --editor --quit
      - name: Test spell semantics
        run: godot --headless --path game --script res://tests/test_spells.gd
      - name: Test run progression
        run: godot --headless --path game --script res://tests/test_run.gd
      - name: Test keyboard and mouse controls
        run: godot --headless --path game --script res://tests/test_controls.gd
      - name: Stress bounded spell resolution
        run: godot --headless --path game --script res://tests/test_stress.gd
      # The image installs templates under /root, but container jobs run with HOME=/github/home.
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Export Windows debug build
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Windows Desktop" ../build/Spellforge.exe
          test -s build/Spellforge.exe
      - name: Upload Windows demo candidate
        uses: actions/upload-artifact@v4
        with:
          name: spellforge-windows-debug
          path: build/Spellforge.exe
          if-no-files-found: error
